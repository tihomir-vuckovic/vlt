services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vlt
      MYSQL_USER: vlt
      MYSQL_PASSWORD: vlt
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vlt?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: vlt
      DB_PASSWORD: vlt
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: