quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:vlt}
quarkus.datasource.password=${DB_PASSWORD:vlt}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/vlt?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=VLT League API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.log.category."rs.vlt.league".level=INFO